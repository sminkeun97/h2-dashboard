<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>에너지&수소 시장 Dashboard</title>
<style>
/* 현대하모니 글꼴: PC에 설치된 경우 사용 (글꼴 파일은 배포하지 않음) */
@font-face{font-family:'HMG Harmony';font-weight:300;src:local('HDharmony L'),local('HDharmonyL'),local('현대하모니 L')}
@font-face{font-family:'HMG Harmony';font-weight:400 500;src:local('HDharmony M'),local('HDharmonyM'),local('현대하모니 M')}
@font-face{font-family:'HMG Harmony';font-weight:600 900;src:local('HDharmony B'),local('HDharmonyB'),local('현대하모니 B')}
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f172a;--sub:#5b6577;--line:#e3e8f0;--navy:#0b2e6b;--teal:#0e9f9a;--up:#d92d20;--down:#1d63d8;--warn:#b45309;--ok:#0f8a4b;--chip:#eef2f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'HMG Harmony','HDharmony M','현대하모니 M',Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea,svg text{font-family:inherit}
a{color:var(--navy);text-decoration:none}a:hover{text-decoration:underline}
header{background:linear-gradient(120deg,#0b2e6b,#0e5a8a 60%,#0e9f9a);color:#fff;padding:18px 28px 14px}
header .ttl{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.4px}
header .by{font-size:12.5px;font-weight:500;opacity:.92;padding:3px 10px;border:1px solid rgba(255,255,255,.45);border-radius:99px}
header .meta{opacity:.88;font-size:12.5px;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
header .pills{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11.5px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.16)}
.pill.bad{background:#fde2e1;color:#912018}.pill.warn{background:#fff1d6;color:#7a4b00}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 20px;overflow-x:auto}
nav button{border:0;background:none;padding:12px 14px;font:inherit;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--navy);border-bottom-color:var(--teal)}
nav button[data-k=audit]{margin-left:auto;font-weight:500;font-size:12.5px;color:#94a3b8}nav button[data-k=audit].on{color:var(--navy)}
main{padding:18px 24px 40px;max-width:1480px;margin:0 auto}
section.tab{display:none}section.tab.on{display:block}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}.span2,.span3{grid-column:auto}main{padding:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h3{margin:0 0 2px;font-size:14.5px;color:var(--navy)}
.card .desc{color:var(--sub);font-size:12px;margin-bottom:10px;line-height:1.45}
.kpi .t{font-size:12.5px;color:var(--sub);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi .s{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.45}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--navy);margin-right:4px}
.badge.h2{background:#d9f5f3;color:#0b6d69}.badge.mk{background:#e6edff;color:#1e3a8a}.badge.new{background:#fde2e1;color:#912018}
.brief{border-left:5px solid var(--teal)}
.brief .head{font-size:19px;font-weight:800;line-height:1.4;margin:4px 0 10px;color:#0b2447}
.brief li{line-height:1.6}
.brief ul{margin:6px 0 0;padding-left:18px}.brief li{margin:3px 0}
.brief .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media(max-width:900px){.brief .cols{grid-template-columns:1fr}}
.brief .box{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.brief .box b{color:var(--navy)}
.stale{background:#fff1d6;color:#7a4b00;border-radius:8px;padding:6px 10px;font-size:12.5px;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin:2px 0 4px}
.legend span{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:5px}
.legend span.off{opacity:.35}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.axis text{font-size:11px;fill:#7a8496}.grid line{stroke:#edf0f5}
#tip{position:fixed;pointer-events:none;background:rgba(15,23,42,.94);color:#fff;font-size:12px;padding:7px 9px;border-radius:8px;z-index:50;display:none;max-width:320px;line-height:1.45}
#tip .r{display:flex;justify-content:space-between;gap:12px}#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.ranges{display:flex;gap:4px;margin:4px 0 2px;flex-wrap:wrap}
.ranges button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 8px;font-size:11.5px;cursor:pointer;color:var(--sub)}
.ranges button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.hours{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
@media(max-width:720px){.hours{grid-template-columns:repeat(6,1fr)}}
.hours div{border-radius:8px;padding:6px 4px;text-align:center;font-size:11.5px;border:2px solid transparent}
.hours div b{display:block;font-size:14px;color:#0f172a}
.hours div.now{border-color:#0f172a;box-shadow:0 0 0 2px #fff inset}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th{color:var(--sub);font-weight:600;background:#f8fafc}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t td.l{text-align:left;white-space:normal}
.scroll{overflow-x:auto}
.heat{display:grid;gap:2px;font-size:10.5px}
.heat .c{height:20px;border-radius:3px}
.heat .rl{color:var(--sub);text-align:right;padding-right:6px;white-space:nowrap;line-height:20px}
.heat .hl{color:var(--sub);text-align:center}
.news{list-style:none;margin:0;padding:0}
.news li{padding:8px 0;border-bottom:1px solid var(--line)}
.news li .m{font-size:11.5px;color:var(--sub)}
.news li .w{font-size:12.5px;color:#334155;margin-top:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
.filters button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.filters input{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font:inherit;font-size:12.5px;min-width:180px}
.note{font-size:11.5px;color:#7a8496;margin-top:8px;line-height:1.5}
.split{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stat{background:#f7f9fc;border-radius:10px;padding:8px 12px;min-width:120px}
.stat .t{font-size:11.5px;color:var(--sub)}.stat .v{font-size:17px;font-weight:800}
.st-partial{color:var(--warn);font-weight:700}.st-fresh{color:var(--ok);font-weight:700}.st-retained{color:var(--warn);font-weight:700}.st-failed,.st-unavailable{color:var(--up);font-weight:700}
footer{color:var(--sub);font-size:11.5px;text-align:center;padding:10px 0 30px}
</style>
</head>

eadline":"SMP 141원(-11%), 포근해지자 4일 상승 끝·160원↑ 5시간 · 中 수소값 kg당 25위안 목표 vs 韓 예산 23%↓","keyPoints":["육지 SMP 140.89원(-10.7%), 4일 연속 상승 끝 · 160원 이상 13→5시간(오전 7시~정오) → 아침 최저 -4→5도로 하루 수요예측 4.4%↓, 비싼 시간이 아침에만 남음","낮 12시~밤 9시가 151원대로 묶임: 이달 평일 같은 수요(7만MW대) 시간의 84%가 160원 이상이던 것과 대조 → 연료비 싼 LNG가 가격 결정(추정), 포근한 평일 바닥이 175원보다 낮을 수 있음","최대전력 11/25 실적 79.1GW로 예보(80.5GW) 밑, 11월 기록(82.7GW) 경신 무산 → 오늘 예보 76.5GW·예비율 29.9%로 여유, 12월 한파 때 85GW대(KPX 주간 전망)가 다음 시험대","중국, 5개 권역 수소 시범에 4년간 최대 80억위안(약 1.6조원)·2030년 수소값 kg당 25위안 이하 목표 vs 한국 2027년 수소차 예산 4,457억원(-22.6%) → 경쟁 축이 차값 보조에서 연료값으로","노르웨이 보되 20MW 그린수소, 핵심 구매처인 수소 페리 지연에 가동 2027년 여름으로 · 일반수소 입찰 11/27 등록 마감, CCUS 최대 3.2점 → 구매 계약도 일정 위험, 연료전지는 탄소포집이 당락 변수"],"insights":[{"type":"이상 신호","h":"수요는 11월 평일 5위, 160원↑은 5시간 최저","line":"이달 평일 7만MW대 시간은 84%가 160원↑였는데 오늘 저녁은 151원 → 싼 LNG가 가격 결정한 듯, 포근한 평일 하루 약 9원 낮춰"},{"type":"가설 점검","h":"최대전력 79.1GW, 11월 기록 도전 멈춰","line":"어제 예보 80.5GW보다 1.4GW 적게 써 사흘 만에 예보 아래 → 낮 16도인 오늘 예보 76.5GW, 기록(82.7GW) 경신은 다음 한파로"},{"type":"연결","h":"中 수소값 목표 kg당 약 5천원, 한국의 절반","line":"중국은 최대 80억위안을 쓴 수소량·차량 실적대로 지급, 한국은 충전가 10,615원에 예산 23%↓ → 상용 트럭 경쟁은 연료값에서 갈림"}],"issues":[{"tag":"정책","h":"中 수소 시범 80억위안·kg당 25위안 목표 vs 韓 예산↓","fact":"중국 공업정보화부·재정부·발개위: 5개 권역에 4년간 권역당 최대 16억위안(총 80억위안, 약 1.6조원)을 수소 사용 실적 점수(1점=8만위안)로 지급, 2030년 연료전지차 10만대·수소값 kg당 25위안 이하 목표. 한국 2027년 수소차 예산 4,457억원(-22.6%)","insight":"차를 살 때가 아니라 '쓴 수소량·운행 실적'에 돈을 줘 연료값을 직접 낮추는 구조 → 목표 25위안(약 5천원)은 한국 충전가 10,615원의 절반. 지난해 판매도 중국 7,797대가 한국 6,802대를 넘음(SNE). 상용 트럭·버스 물량으로 규모를 키우는 중국과 달리 한국은 지방비 부족에 수소버스 국비 약 1,170억원 미집행 추산(보도)","next":"국회 예산 확정(12/2 법정기한) 수소차·충전소 증액 여부, 중국 권역별 실시방안"},{"tag":"PEM·유럽","h":"노르웨이 보되 20MW, 수소 페리 지연에 가동 연기","fact":"GreenH·Luxcara 보되 수전해 20MW(연 최대 3,100t, 2025.1 FID, 금융 NOK 10억)는 Torghatten Nord 수소 페리 2척 공급이 기반. 페리는 2025.10 취항 예정에서 1척 2027년 여름(바이오연료로 먼저)·1척 2027.11로 밀렸고 공장 완전 가동도 2027년 여름 목표","insight":"확정 구매자를 확보한 노르딕 대표 사업도 구매자 설비(선박)가 늦으면 매출이 함께 밀림 → 구매 계약 하나에 기댄 사업은 수요 위험 대신 일정 위험을 짐. 핵심 부품 조달 지연·안전 인허가도 원인으로 보도돼, 비중국 PEM 공급사엔 납기·인허가 대응력이 수주 경쟁력(해석)","next":"Moskenes 수소 시운전(2027 성수기 후), IF26 12/3 개시·비중국 요건"},{"tag":"수소발전","h":"일반수소 입찰 등록 마감, CCUS가 최대 3.2점","fact":"일반수소발전 입찰(930GWh·20년) 등록 11/27 마감, 제안서 11/30~12/4. 올해 신설 CCUS 항목은 비가격 100점 중 최대 8점(포집 60% 이상 4점 × 활용·저장 최대 2점), 비가격 비중 40%라 총점 기준 최대 3.2점(11/24 세미나)","insight":"카본밸류 분석: 10MW SOFC에 포집 62% 설비(투자 약 150억원)를 달고 액화탄산을 t당 14만원에 팔면 순 포집원가 kWh당 6.3원, 가점으로 생기는 입찰가 여력은 9.6원 → 판매처 없으면 가점만으론 회수 어려움. 물량이 28% 준 경쟁이라 3점 안팎이 당락을 가를 수 있어 CO₂ 판매처가 새 경쟁 요소","next":"제안서 제출(11/30~12/4) 물량·경쟁률, 우선협상대상자 선정(12/30)"},{"tag":"Global FCEV","h":"다임러 액화수소 트럭 100대, 충전 방식 경쟁","fact":"Daimler Truck은 NextGenH2(액화수소 최대 85kg, 만재 1,000km 이상)를 2027년부터 뵈르트 공장에서 100대 소량 생산, 절반가량 배정 완료. 1세대 5대는 2024년 여름부터 고객 10곳에서 60만km 이상 운행. 40t 탱크로리 1대가 액화수소 3.9t(트럭 약 45대분) 운송(11/25)","insight":"다임러는 액화수소(충전소 전력 kg당 0.05kWh), 현대차 엑시언트는 기체 압축수소로 유럽 누적 1,200만 마일 이상(2026.1)을 달려 충전 인프라 방식 경쟁이 붙는 구조. 중국 물량 공세와 유럽 기술 경쟁 사이에서 상용 수소트럭의 승부는 차보다 충전소 밀도와 수소값(해석)","next":"다임러 첫 고객 Dachser 12월 말 투입, 독일 액화수소 충전소 확충 계획"}],"smpWhy":{"title":"SMP 왜 내렸나 (11/26, 목)","items":[{"h":"포근해진 날씨, 수요예측 4% 감소","d":["아침 최저 -4.4→5도, 낮 최고 7→16도로 하루 평균 수요예측 66,811→63,897MW(-4.4%), 최대 74,968→71,924MW","11/25 최대전력 실적도 79.1GW로 예보(80.5GW)보다 1.4GW 적어 추위 수요가 꺾이는 흐름"]},{"h":"낮 12시~밤 9시 151원대, 이달 드문 가격대","d":["어제 176.5원이던 오후·저녁이 150.6~151.6원으로 한 단계 내려옴. 10월 이후 150~152원대는 하루 최대 2시간뿐이었음","저녁 수요예측 7.0~7.2만MW로 이달 평일 같은 수요 시간(84%가 160원 이상, 중간값 173원)보다 20원가량 낮음 → LNG 중 연료비 싼 발전기가 가격 결정한 것으로 추정(EPSIS 확인 필요)"]},{"h":"비싼 시간은 아침 5시간, 최고 184원","d":["160원 이상은 오전 7시~정오 5시간(어제 13시간), 11월 평일 중 가장 적음. 오전 8~9시 184.13원은 이 시간대 11월 두 번째 고가","새벽 0~7시 98.9~115.3원(어제 102~145원). 새벽 5시 5.6만→오전 9시 7.1만MW로 늘어나는 아침 수요를 비싼 설비가 메운 것으로 추정"]},{"h":"전일 대비: 오후·저녁이 하락의 절반","d":["낮 12시~밤 9시가 하루 평균을 8.5원 끌어내림, 자정~오전 7시 -4.4원, 밤 9시~자정 -2.7원, 오전 7시~정오 -1.1원(단순평균 156.1→139.4원)"]}]},"power":"추위가 꺾이자 SMP도 바로 꺾임. 11/26 육지 140.89원(-10.7%)으로 4일 연속 상승이 멈췄고 160원 이상은 아침 5시간으로 줄었음. 특이한 건 저녁 수요가 7만MW대인데도 151원에 묶인 점으로, 이달 같은 수요에서 보통 165~177원이던 것과 달라 LNG 중 연료비 싼 설비가 가격을 정한 것으로 추정 → 포근한 평일 바닥이 '175원 천장'보다 한 칸 아래(151원)에 있을 수 있음. 11월 1~26일 평균 133.2원, 12월 추정 135.1원(123.3~145.9원), 4분기 약 126원. 최대전력은 11/25 79.1GW로 예보 아래, 오늘 예보 76.5GW·예비율 29.9%. REC는 11/24 71,059원(매수/매도 1.11), 오늘 거래는 오후 공표.","hydrogen":"수소 보급의 승부처가 차값 보조에서 연료값으로 옮겨가는 흐름. 중국은 5개 권역에 4년간 최대 80억위안을 '쓴 수소량' 실적대로 주며 2030년 kg당 25위안(약 5천원)을 겨냥하는 반면, 한국은 수소차 예산이 23% 줄고 충전가는 10,615원(249곳)으로 4일째 보합. 유럽에선 다임러가 액화수소 트럭 100대 소량 생산(2027)을 예고했고, 노르웨이 보되 20MW는 구매처 페리 지연으로 가동이 2027년 여름으로 밀려 '확정 구매자'의 일정 위험이 드러남. 덴마크 Dynelectro의 아이슬란드 SOEC는 시스템 전력 38.6kWh/kg(열 별도)으로 PEM(약 55kWh)보다 30% 적어, 폐열·지열이 있는 곳에선 PEM의 경쟁자. 오늘 SMP 기준 PEM 전력비는 kg당 7,749원.","watch":["11/26(목) REC(오후 공표): 사려는 주문(11/24 53만)이 더 줄어 7.1만원 박스 하단(7.0만원)을 시험하는지","11/27(금) SMP(오늘 오후 공표): 포근한 평일에도 저녁 151원대가 이어지는지, 아침 180원대 급등이 반복되는지","11/27 재생에너지 설명회: 계약시장 고시 초안·상한가 방식, REC 현물 전환시장, 일반수소 입찰 등록 마감","12월 초: 겨울철 전력수급 대책·계절관리제 석탄 정지 기수, 12월 발전용 가스요금(월말), 국회 예산(12/2) 수소차 증액","PEM·유럽: IF26 12/3 개시·비중국 요건, 티센크루프 수소 입찰 등록(~12/17), 보되 수소 페리 시운전 일정"],"newsPicks":[{"id":"N0O89TZ","tag":"정책","why":"중국 5개 권역 4년간 최대 80억위안·2030년 수소차 10만대 목표 → 한국은 예산 22.6%↓, 상용차 주도권 흔들","title":"中 수소차 보급 1.6조 투입…韓 10만대 고지 선점 흔들","url":"https://news.google.com/rss/articles/CBMiWkFVX3lxTE0yQ3dXSXExYzhid1Q4MnJvNzV6QXZDck53czNIY0lFUFl2cW9sUUxuMS1WVU5LVkd5WGpWaWxBN1d1M3JSVnUwUGlLa19RbkRzeEU5b2czVl9Zdw?oc=5","source":"파이낸셜뉴스","pub":"2026-11-25T01:43:28.000Z","lang":"ko"},{"id":"N6Q4FAT","tag":"PEM·유럽","why":"노르웨이 보되 20MW, 구매처 수소 페리 지연에 가동 연기 → 확정 구매 계약도 일정 위험이 남음","title":"Developers push back start-up of green hydrogen project amid delays to delivery of H₂ ferries","url":"https://news.google.com/rss/articles/CBMi4AFBVV95cUxOdUl1U01PdVhnUDdDcUdVVlQwX0NlUWdrWDB6R2RnVmNoQVFkZEhsaHgzRUI3VDRNRXk5MlFGYW9fNTB4Ny1RclNfdTVNWjlpay0yVGdOTTYteVR2Y3ZlbDRDcnB3blcyVDJXa0hUZzVSNlBrcFlxR3lRUmVTYWJyX1FEdHFzT3Bhb2dDWHMyMHpsRWR1eHg0RzE3ZXA4dHItTnZiRVJQaGh3M245TloyNWFOazk4LVZLamhjRk1yTk1UOWZ6MEloc2d2Q2lLT2NDaGxBUUxUYWtmYlFuZktKUw?oc=5","source":"Hydrogen Insight","pub":"2026-11-25T05:19:58.000 function heatmap(host, days) {

  const lo = Math.min(...all), hi = Math.max(...all);

  g.append(H('div', {}, ''));
  for (let i = 1; i <= 24; i++) g.append(H('div', { class: 'hl' }, i % 3 === 0 ? i + 'h' : ''));
  for (const d of days) {
    const wd = '일월화수목금토'[new Date(d + 'T00:00:00Z').getUTCDay()];
    g.append(H('div', { class: 'rl' }, `${d.slice(5)}(${wd})`));

  }
  host.append(g, H('div', { class: 'note' }, `범위 ${fmt(lo, 1)} ~ ${fmt(hi, 1)} 원/kWh`));
}

function priceCard(P, refDate) {
  const c = H('div', { class: 'card', style: 'margin-top:14px;max-width:1000px;box-sizing:border-box' });
  c.innerHTML = '<h3>수전해 가격 모니터</h3><div class="desc">공개 보고서·입찰 결과에 나온 가격을 날짜순으로 누적. $/kW는 환산값이며 범위(스택/시스템/설치)와 기준이 달라 직접 비교에 주의</div>';
  if (!P.length) { c.innerHTML += '<div class="note">아직 수집된 가격이 없습니다.</div>'; return c; }
  const pick = (rg, tech, scope) => P.filter(p => rg.test(p.region) && p.tech === tech && scope.test(p.scope) && p.usdPerKw).sort((a, b) => b.date.localeCompare(a.date))[0];
  const ks = [['중국 ALK 스택', pick(/中|중국/, 'ALK', /스택/)], ['중국 ALK 시스템', pick(/中|중국/, 'ALK', /시스템/)], ['중국 PEM 시스템', pick(/中|중국/, 'PEM', /시스템/)], ['서구 ALK 시스템', pick(/유럽|서구|EU|美|미국/, 'ALK', /시스템/)], ['서구 PEM 시스템', pick(/유럽|서구|EU|美|미국/, 'PEM', /시스템/)]];
  const usd = v => '&#36;' + fmt(v);
  c.innerHTML += '<div class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:6px 0 10px">' + ks.map(([t, p]) => '<div style="background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:8px 10px"><div style="font-size:11.5px;color:var(--sub);font-weight:600">' + t + '</div><div style="font-size:19px;font-weight:800">' + (p ? usd(p.usdPerKw) + '<small style="font-size:11px;color:var(--sub)">/kW</small>' : '-') + '</div><div style="font-size:11px;color:var(--sub)">' + (p ? esc(p.date) + ' · ' + esc(p.source) : '데이터 없음') + '</div></div>').join('') + '</div>';
  const p0 = s => (s || '').slice(0, 10);
  const recent = d => refDate && d && p0(d) >= addDays(refDate, -6);
  const rows = P.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 14);
  c.innerHTML += '<table class="t"><tr><th>시점</th><th>지역</th><th>기술</th><th>범위</th><th style="text-align:left">가격</th><th>환산 /kW</th><th style="text-align:left">출처</th></tr>' + rows.map(p => '<tr><td>' + esc(p.date) + (recent(p.addedAt) ? ' <span class="badge new">NEW</span>' : '') + '</td><td>' + esc(p.region) + '</td><td>' + esc(p.tech) + '</td><td>' + esc(p.scope) + '</td><td class="l">' + esc(p.value) + (p.note ? '<div class="note" style="margin:2px 0 0">' + esc(p.note) + '</div>' : '') + '</td><td>' + (p.usdPerKw ? usd(p.usdPerKw) : '-') + '</td><td class="l"><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.source) + '</a></td></tr>').join('') + '</table>';
  return c;
}
