<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>에너지&수소 시장 Dashboard</title>
<style>
/* 현대하모니 글꼴: PC에 설치된 경우 사용 (글꼴 파일은 배포하지 않음) */
@font-face{font-family:'HMG Harmony';font-weight:300;src:local('HDharmony L'),local('HDharmonyL'),local('현대하모니 L')}
@font-face{font-family:'HMG Harmony';font-weight:400 500;src:local('HDharmony M'),local('HDharmonyM'),local('현대하모니 M')}
@font-face{font-family:'HMG Harmony';font-weight:600 900;src:local('HDharmony B'),local('HDharmonyB'),local('현대하모니 B')}
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f172a;--sub:#5b6577;--line:#e3e8f0;--navy:#0b2e6b;--teal:#0e9f9a;--up:#d92d20;--down:#1d63d8;--warn:#b45309;--ok:#0f8a4b;--chip:#eef2f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'HMG Harmony','HDharmony M','현대하모니 M',Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea,svg text{font-family:inherit}
a{color:var(--navy);text-decoration:none}a:hover{text-decoration:underline}
header{background:linear-gradient(120deg,#0b2e6b,#0e5a8a 60%,#0e9f9a);color:#fff;padding:18px 28px 14px}
header .ttl{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.4px}
header .by{font-size:12.5px;font-weight:500;opacity:.92;padding:3px 10px;border:1px solid rgba(255,255,255,.45);border-radius:99px}
header .meta{opacity:.88;font-size:12.5px;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
header .pills{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11.5px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.16)}
.pill.bad{background:#fde2e1;color:#912018}.pill.warn{background:#fff1d6;color:#7a4b00}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 20px;overflow-x:auto}
nav button{border:0;background:none;padding:12px 14px;font:inherit;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--navy);border-bottom-color:var(--teal)}
main{padding:18px 24px 40px;max-width:1480px;margin:0 auto}
section.tab{display:none}section.tab.on{display:block}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}.span2,.span3{grid-column:auto}main{padding:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 2px;font-size:14.5px;color:var(--navy)}
.card .desc{color:var(--sub);font-size:12px;margin-bottom:8px}
.kpi .t{font-size:12.5px;color:var(--sub);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi .s{font-size:12px;color:var(--sub);margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--navy);margin-right:4px}
.badge.h2{background:#d9f5f3;color:#0b6d69}.badge.mk{background:#e6edff;color:#1e3a8a}.badge.new{background:#fde2e1;color:#912018}
.brief{border-left:5px solid var(--teal)}
.brief .head{font-size:19px;font-weight:800;line-height:1.4;margin:4px 0 10px;color:#0b2447}
.brief ul{margin:6px 0 0;padding-left:18px}.brief li{margin:3px 0}
.brief .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media(max-width:900px){.brief .cols{grid-template-columns:1fr}}
.brief .box{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.brief .box b{color:var(--navy)}
.stale{background:#fff1d6;color:#7a4b00;border-radius:8px;padding:6px 10px;font-size:12.5px;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin:2px 0 4px}
.legend span{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:5px}
.legend span.off{opacity:.35}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.axis text{font-size:11px;fill:#7a8496}.grid line{stroke:#edf0f5}
#tip{position:fixed;pointer-events:none;background:rgba(15,23,42,.94);color:#fff;font-size:12px;padding:7px 9px;border-radius:8px;z-index:50;display:none;max-width:320px;line-height:1.45}
#tip .r{display:flex;justify-content:space-between;gap:12px}#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.ranges{display:flex;gap:4px;margin:4px 0 2px;flex-wrap:wrap}
.ranges button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 8px;font-size:11.5px;cursor:pointer;color:var(--sub)}
.ranges button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.hours{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
@media(max-width:720px){.hours{grid-template-columns:repeat(6,1fr)}}
.hours div{border-radius:8px;padding:6px 4px;text-align:center;font-size:11.5px;border:2px solid transparent}
.hours div b{display:block;font-size:14px;color:#0f172a}
.hours div.now{border-color:#0f172a;box-shadow:0 0 0 2px #fff inset}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th{color:var(--sub);font-weight:600;background:#f8fafc}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t td.l{text-align:left;white-space:normal}
.scroll{overflow-x:auto}
.heat{display:grid;gap:2px;font-size:10.5px}
.heat .c{height:20px;border-radius:3px}
.heat .rl{color:var(--sub);text-align:right;padding-right:6px;white-space:nowrap;line-height:20px}
.heat .hl{color:var(--sub);text-align:center}
.news{list-style:none;margin:0;padding:0}
.news li{padding:8px 0;border-bottom:1px solid var(--line)}
.news li .m{font-size:11.5px;color:var(--sub)}
.news li .w{font-size:12.5px;color:#334155;margin-top:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
.filters button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.filters input{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font:inherit;font-size:12.5px;min-width:180px}
.note{font-size:11.5px;color:var(--sub);margin-top:6px}
.split{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stat{background:#f7f9fc;border-radius:10px;padding:8px 12px;min-width:120px}
.stat .t{font-size:11.5px;color:var(--sub)}.stat .v{font-size:17px;font-weight:800}
.st-fresh{color:var(--ok);font-weight:700}.st-retained{color:var(--warn);font-weight:700}.st-failed,.st-unavailable{color:var(--up);font-weight:700}
footer{color:var(--sub);font-size:11.5px;text-align:center;padding:10px 0 30px}
</style>
</head>

VENRcVZtdExYaUE0?oc=5","source":"BioEnergy Times","pub":"2026-10-26T09:00:14.000Z","lang":"en","cats":["Global H2","Global 정책"],"dups":0},{"id":"NDT9D53","title":"지역별 전기요금제, 민간발전사에 ‘불똥’⋯수익 6600억 감소","url":"https://news.google.com/rss/articles/CBMiZEFVX3lxTFBYU2pIekdPNk9iWFJuSFVRbmFNbkZYNHNLbTYtYUtNV2d3MFF0UGhQV2pSbzZyeEVrU0hYZkRXOWFQNjZKRVFCbFRxY1Fyc3NyWkRnbVltX3Y2cldKNG9kLWhEWVU?oc=5","source":"일요시사","pub":"2026-10-26T08:59:36.000Z","lang":"ko","cats":["전력시장"],"dups":1}],"briefing":{"date":"2026-10-28","generatedAt":"2026-10-28T04:31:04.585Z","author":"Aside 에이전트","headline":"SMP 107원대 약보합·예비율 여유, 수소는 현대차그룹 WHE 2026 상용 연료전지 공개가 국내 이슈 주도","keyPoints":["육지 SMP(10/28 거래분) 가중평균 107.18원/kWh로 전일 대비 -1.6%, 직전 7일 평균 대비 -1.5%. 일중 스프레드 12.9원으로 최근 30일 평균(24.2원)의 절반 수준","오늘 최대부하 전망 71,100MW(18~19시), 공급예비율 30%로 '정상'. 전일(10/27) 최소전력이 13시(45,713MW)에 발생해 낮 시간 태양광 영향 지속","발전용 LNG 요금(KOGAS 일반)은 11월분 25,723.7원/GJ로 10월 대비 약 +2.5%, 4월(16,707원) 이후 8개월 연속 상승(+54%). 반면 SMP 월평균은 8월 148.39원 → 9월 119.02원, 10월(1~28일) 일평균의 평균 109.6원으로 하락해 연료비와 반대로 움직이는 중","SMP 추정(가스요금 변화율 기반): 10월 진행 109.6원/kWh, 11월 111.0원(80% 범위 100~123), 12월 112.6원, '27.1월 116.1원. 가스요금 상승분의 절반 정도만 SMP에 반영되는 최근 흐름을 가정함","REC(10/27, 거래속보) 육지 평균 71,421원/REC(직전 10/22 대비 +24원), 체결 512,305 REC, 매수주문 1,235,509 REC로 매도주문(674,112 REC)의 1.8배. 최근 1년 육지 평균 69,711~72,916원 범위 유지","수소 충전가 전국 평균 10,518원/kg(248곳), 지역 최고 제주 15,000원·최저 울산 9,684원. 오늘부터 일별 추이 누적 시작"],"power":"SMP는 10월 들어 대체로 100~110원대(일평균 범위 103.6~135.2원)에서 움직임. 가스요금 상승에도 SMP가 내려간 것은 가을 비수기 수요 감소, 원자력·석탄 비중(전일 각 31%) 확대, 낮 시간 태양광(전일 피크 21,342MW) 증가가 함께 관찰된 결과로 보임. 단, LNG의 가격결정 시간 비중은 EPSIS 연료원별 SMP결정 자료 공표 후 확인 필요. 서울 기온이 전일 16.1/7.8℃에서 오늘 13/2℃로 하락해 난방수요가 늘면 저녁 피크(17~22시) 가격이 먼저 반응할 가능성.","hydrogen":"국내는 현대차그룹이 WHE 2026에서 내구성을 높인 상용 수소연료전지 시스템을 처음 공개하고 수소트럭 자동충전 로봇을 시연했다는 보도가 집중됨(유사기사 10건 이상). 정책 측면에서는 동해·삼척의 '2027년 제5기 수소도시'(약 400억원) 선정 보도가 이어짐. 해외는 EU 수소 규정 제안이 4개월 지연된 가운데 Siemens Energy가 규제 불확실성으로 그린수소 FID가 어렵다고 언급하는 등 유럽 프로젝트의 속도 조절 신호가 이어지는 중. 일본 최대 수소 액화 플랜트 착공 소식도 있음."," function newsExplorer(host) {
  const cats = [...new Set(D.news.flatMap(n => n.cats))];
  const st = { cat: '전체', lang: '전체', q: '' };
  const f = H('div', { class: 'filters' }); const list = H('ul', { class: 'news' });
  const btns = [];
  const mkBtn = (grp, v) => { const b = H('button', { onclick: () => { st[grp] = v; draw(); } }, v); b.dataset.g = grp; b.dataset.v = v; btns.push(b); f.append(b); };
  ['전체', '국내', '해외'].forEach(v => mkBtn('lang', v)); f.append(H('span', { style: 'width:8px' }));
  ['전체', ...cats].forEach(v => mkBtn('cat', v));
  const inp = H('input', { placeholder: '키워드 검색 (예: 수전해, CHPS, 넥쏘)' }); inp.addEventListener('input', () => { st.q = inp.value.trim().toLowerCase(); draw(); }); f.append(inp);
  host.append(f, list);
  const day = D.today;
  function draw() {
    btns.forEach(b => b.classList.toggle('on', st[b.dataset.g] === b.dataset.v));
    const rows = D.news.filter(n => (st.lang === '전체' || (st.lang === '국내') === (n.lang === 'ko')) && (st.cat === '전체' || n.cats.includes(st.cat)) && (!st.q || (n.title + n.source).toLowerCase().includes(st.q))).slice(0, 80);
    list.innerHTML = rows.map(n => `<li>${n.cats.map(c => `<span class="badge ${/수소|H2|FCEV|생산|모빌리티/.test(c) ? 'h2' : 'mk'}">${esc(c)}</span>`).join('')}${new Date(n.pub).toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }) >= addDays(day, -1) ? '<span class="badge new">NEW</span>' : ''}<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a><div class="m">${esc(n.source)} · ${tsK(n.pub)}${n.dups ? ` · 유사 기사 ${n.dups}건 묶음` : ''}</div></li>`).join('') || '<li class="note">조건에 맞는 뉴스가 없습니다.</li>';
  }
  draw();
}
